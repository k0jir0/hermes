{{- if and (eq .Values.storage.vectorBackend "cloudflare_vectorize") (not .Values.storage.auth.existingSecret) }}
{{- fail "storage.auth.existingSecret is required when storage.vectorBackend=cloudflare_vectorize" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes.fullname" . }}-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes.name" . }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hermes.name" . }}
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "hermes.serviceAccountName" . }}
      containers:
        - name: gateway
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: {{ .Values.gateway.service.port | quote }}
            - name: HERMES_REGION
              value: {{ .Values.gateway.env.region | quote }}
            - name: HERMES_ALLOWED_SUBNETS
              value: {{ .Values.gateway.env.allowedSubnets | quote }}
            - name: HERMES_REQUEST_TIMEOUT_MS
              value: {{ .Values.gateway.env.timeoutMs | quote }}
            - name: HERMES_REDIS_URL
              value: {{ .Values.storage.redisUrl | quote }}
            - name: HERMES_POSTGRES_URL
              value: {{ .Values.storage.postgresUrl | quote }}
            - name: HERMES_VECTOR_BACKEND
              value: {{ .Values.storage.vectorBackend | quote }}
            - name: HERMES_VECTOR_NAMESPACE
              value: {{ .Values.storage.vectorNamespace | quote }}
            - name: HERMES_VECTOR_DATABASE
              value: {{ .Values.storage.vectorDatabase | quote }}
            - name: HERMES_VECTOR_TABLE
              value: {{ .Values.storage.vectorTable | quote }}
            - name: HERMES_VECTOR_URL
              value: {{ .Values.storage.vectorUrl | quote }}
            {{- if .Values.storage.auth.existingSecret }}
            - name: HERMES_VECTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.auth.existingSecret | quote }}
                  key: {{ .Values.storage.auth.tokenKey | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
{{ toYaml .Values.gateway.resources | indent 12 }}
